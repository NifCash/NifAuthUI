# Hər PR açılanda və yeniləndikdə Claude Code Reviewer kimi avtomatik review edir.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude-un öz düzəliş commit-lərindən sonra da review işləsin
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Sən komandanın Code Reviewer-isən. Bu PR-ı yoxla: baqlar, təhlükəsizlik, səhv idarəsi,
            oxunaqlılıq, performans və testlərin olub-olmaması. CLAUDE.md-dəki qaydalara əməl et.
            Ən vacib problemləri birinci yaz, kiçik zövq məsələlərini böyütmə.

            - Konkret sətrə aid problemlər üçün inline şərh yaz (mcp__github_inline_comment__create_inline_comment).
            - Sonda `gh pr comment` ilə Azərbaycan dilində qısa ümumi xülasə yaz.
              İlk sətir belə olsun: "Nəticə: Merge-ə hazırdır" və ya "Nəticə: Düzəliş lazımdır".
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
