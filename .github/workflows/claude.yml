# Issue və ya PR-da "@claude" yazılanda Claude kodu yazır / düzəliş edir.
# Anthropic-in rəsmi nümunəsi əsasında (anthropics/claude-code-action/examples/claude.yml).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Claude PR-dakı CI nəticələrini oxuya bilsin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Layihə qaydaları repo-nun kökündəki CLAUDE.md faylındadır.
          # Testləri işə sala bilməsi üçün lazım olan əmrləri bura əlavə et, məsələn:
          # claude_args: |
          #   --allowedTools "Bash(npm install),Bash(npm run test:*),Bash(npm run lint:*)"
