name: Deploy UI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Same logical server lock group name as API (GitHub concurrency is per-repo,
  # so we also flock on the server in the SSH script).
  group: nifauth-ui-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH build + deploy AuthUI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEPLOY_REPO_URL: ${{ secrets.DEPLOY_REPO_URL }}
          DEPLOY_REPO_DIR: ${{ secrets.DEPLOY_REPO_DIR }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 25m
          envs: GH_PAT,DEPLOY_REPO_URL,DEPLOY_REPO_DIR,DEPLOY_BRANCH
          script: |
            set -euo pipefail

            # Serialize with API deploy on the same machine.
            exec 9>/var/lock/nifauth-deploy.lock
            flock -w 900 9

            wait_apt() {
              while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 \
                 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1 \
                 || fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
                echo "Waiting for apt lock..."
                sleep 5
              done
            }

            ensure_pkgs() {
              local missing=()
              for p in "$@"; do
                dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p")
              done
              if ((${#missing[@]})); then
                wait_apt
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -y
                apt-get install -y "${missing[@]}"
              fi
            }

            REPO_DIR="${DEPLOY_REPO_DIR:-/opt/nifauth-ui/src}"
            REPO_URL="${DEPLOY_REPO_URL:-https://github.com/NifCash/NifAuthUI.git}"
            BRANCH="${DEPLOY_BRANCH:-main}"

            ensure_pkgs git curl ca-certificates rsync nginx

            mkdir -p "$(dirname "$REPO_DIR")"

            if [[ ! -d "$REPO_DIR/.git" ]]; then
              echo "==> Cloning repository"
              if [[ -n "${GH_PAT:-}" ]]; then
                AUTH_URL="$(echo "$REPO_URL" | sed "s#https://#https://x-access-token:${GH_PAT}@#")"
                git clone --branch "$BRANCH" "$AUTH_URL" "$REPO_DIR"
              else
                git clone --branch "$BRANCH" "$REPO_URL" "$REPO_DIR"
              fi
            fi

            cd "$REPO_DIR"

            echo "==> Fetch / reset to origin/$BRANCH"
            if [[ -n "${GH_PAT:-}" ]]; then
              git remote set-url origin "$(echo "$REPO_URL" | sed "s#https://#https://x-access-token:${GH_PAT}@#")"
            else
              git remote set-url origin "$REPO_URL"
            fi
            git fetch --prune origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd -e node_modules -e dist -e .publish

            chmod +x scripts/deploy-remote.sh
            REPO_DIR="$REPO_DIR" bash scripts/deploy-remote.sh
